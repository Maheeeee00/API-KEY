<!-- Paste this entire block into your WordPress page (Custom HTML block) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div class="luxury-form-wrapper">
    <div id="success-msg" style="display:none;">
        <i class="fa-solid fa-circle-check"></i>
        <p>Thank you! Your message has been sent successfully.</p>
    </div>

    <div id="form-container">
        <div class="form-row">
            <div class="form-group">
                <i class="fa-regular fa-user"></i>
                <input type="text" id="name" placeholder="Name" required>
            </div>
            <div class="form-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <i class="fa-solid fa-phone-volume"></i>
                <input type="tel" id="phone" placeholder="Phone">
            </div>
            <div class="form-group">
                <i class="fa-solid fa-circle-info"></i>
                <input type="text" id="subject" placeholder="Subject">
            </div>
        </div>

        <div class="form-full-width">
            <i class="fa-solid fa-pen"></i>
            <textarea id="message" placeholder="How can we help you? Feel free to get in touch!"></textarea>
        </div>

        <div class="form-footer">
            <button type="button" class="submit-btn" onclick="submitForm()">
                <i class="fa-solid fa-paper-plane"></i>
                <span id="btn-text">Get in Touch</span>
            </button>

            <label class="privacy-checkbox">
                <input type="checkbox" id="privacy">
                <span>I agree with the <a href="#">Privacy Policy</a>.</span>
            </label>
        </div>

        <p id="error-msg" style="display:none; color:red; margin-top:10px;">
            <i class="fa-solid fa-triangle-exclamation"></i> Please fill in all required fields and accept the Privacy Policy.
        </p>
    </div>
</div>

<style>
    .luxury-form-wrapper {
        padding: 20px;
        border-radius: 10px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        max-width: 900px;
        margin: 0 auto;
    }
    .form-row {
        display: flex;
        gap: 40px;
        margin-bottom: 40px;
    }
    .form-group {
        flex: 1;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #D1C4B2;
        padding-bottom: 10px;
    }
    .form-full-width {
        display: flex;
        align-items: flex-start;
        border-bottom: 1px solid #D1C4B2;
        padding-bottom: 10px;
        margin-bottom: 40px;
    }
    .luxury-form-wrapper i {
        color: #777;
        font-size: 20px;
        margin-right: 15px;
    }
    .luxury-form-wrapper input,
    .luxury-form-wrapper textarea {
        width: 100%;
        border: none !important;
        background: transparent !important;
        outline: none !important;
        font-size: 18px;
        color: #444;
    }
    .luxury-form-wrapper textarea {
        height: 80px;
        resize: none;
    }
    .form-footer {
        display: flex;
        align-items: center;
        gap: 30px;
        margin-top: 20px;
    }
    .submit-btn {
        background-color: #1794CC !important;
        color: white !important;
        border: none;
        padding: 15px 35px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: 0.3s;
    }
    .submit-btn i {
        color: white;
        font-size: 16px;
        margin: 0;
    }
    .submit-btn:hover {
        background-color: #137ba8 !important;
        transform: translateY(-2px);
    }
    .submit-btn:disabled {
        background-color: #aaa !important;
        cursor: not-allowed;
        transform: none;
    }
    .privacy-checkbox {
        display: flex;
        align-items: center;
        font-size: 16px;
        color: #555;
        cursor: pointer;
    }
    .privacy-checkbox input {
        width: 20px !important;
        height: 20px !important;
        margin-right: 10px !important;
    }
    .privacy-checkbox a {
        color: #555;
        text-decoration: underline;
    }
    #success-msg {
        text-align: center;
        padding: 40px 20px;
        color: #2e7d32;
    }
    #success-msg i {
        font-size: 60px;
        color: #2e7d32;
        margin-bottom: 15px;
        display: block;
    }
    #success-msg p {
        font-size: 20px;
        font-weight: 600;
    }
    @media (max-width: 768px) {
        .form-row {
            flex-direction: column;
            gap: 30px;
        }
        .form-footer {
            flex-direction: column;
            align-items: flex-start;
        }
    }
</style>

<script>
const W3F_ACCESS_KEY = 'ed8cf93a-ea5e-40b4-9b39-e7bb29f95b41';

async function submitForm() {
    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const phone   = document.getElementById('phone').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();
    const privacy = document.getElementById('privacy').checked;
    const errMsg  = document.getElementById('error-msg');

    if (!name || !email || !privacy) {
        errMsg.style.display = 'block';
        errMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Please fill in all required fields and accept the Privacy Policy.';
        return;
    }
    errMsg.style.display = 'none';

    const btn = document.querySelector('.submit-btn');
    btn.disabled = true;
    document.getElementById('btn-text').textContent = 'Sending...';

    const formattedMessage = [
        'Contact Form Submission',
        '',
        'Name    : ' + name,
        'Email   : ' + email,
        'Phone   : ' + (phone || 'Not provided'),
        'Subject : ' + (subject || 'Not provided'),
        '',
        'Message:',
        message || '(No message)'
    ].join('\n');

    const payload = {
        access_key: W3F_ACCESS_KEY,
        subject: subject ? 'Contact Form: ' + subject : 'Contact Form - Airport Passes',
        name: name,
        email: email,
        replyto: email,
        from_name: 'Airport Passes Contact Form',
        message: formattedMessage,
        Phone: phone || 'Not provided',
        'Subject Line': subject || 'Not provided'
    };

    try {
        const res = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.success) {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        } else {
            throw new Error(result.message || 'Submission failed');
        }
    } catch (e) {
        btn.disabled = false;
        document.getElementById('btn-text').textContent = 'Get in Touch';
        errMsg.style.display = 'block';
        errMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + (e.message || 'Something went wrong. Please try again.');
    }
}
</script>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Text Extractor — English & Urdu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      /* Jameel Noori Nastaleeq — add fonts/JameelNooriNastaleeq.woff2 next to this file, or change src */
      @font-face {
        font-family: "Jameel Noori Nastaleeq";
        src:
          local("Jameel Noori Nastaleeq"),
          url("fonts/JameelNooriNastaleeq.woff2") format("woff2"),
          url("fonts/JameelNooriNastaleeq.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #0f1419;
        --surface: #1a222d;
        --surface-hover: #232d3b;
        --border: #2d3a4d;
        --text: #e8eef4;
        --text-muted: #8b9cb0;
        --accent: #5b9fd4;
        --radius: 12px;
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", system-ui, sans-serif;
        font-optical-sizing: auto;
        background: radial-gradient(ellipse 120% 80% at 50% -20%, #1e3a5f 0%, var(--bg) 55%);
        color: var(--text);
        line-height: 1.5;
      }

      .app {
        max-width: 1120px;
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 2.5rem);
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .header h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0 auto;
        max-width: 36rem;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .upload-section {
        margin-bottom: 2rem;
      }

      .file-input:focus + .drop-zone,
      .drop-zone:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .drop-zone {
        width: 100%;
        min-height: 200px;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s,
          box-shadow 0.2s;
        box-shadow: var(--shadow);
      }

      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: var(--accent);
        background: var(--surface-hover);
      }

      .drop-zone__icon {
        color: var(--accent);
        opacity: 0.9;
      }

      .drop-zone__title {
        font-size: 1.05rem;
        font-weight: 600;
      }

      .drop-zone__hint {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .status {
        margin: 1rem 0 0;
        min-height: 1.5rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .status--error {
        color: #f08080;
      }

      .status--ok {
        color: #7dcea0;
      }

      .outputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        align-items: stretch;
      }

      @media (max-width: 768px) {
        .outputs {
          grid-template-columns: 1fr;
        }
      }

      .output-panel {
        display: flex;
        flex-direction: column;
        min-height: 280px;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .output-panel__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
        padding: 0.65rem 1rem;
        background: rgba(0, 0, 0, 0.2);
        border-bottom: 1px solid var(--border);
      }

      .output-panel--english .output-panel__head {
        border-left: 3px solid var(--accent);
      }

      .output-panel--urdu .output-panel__head {
        border-right: 3px solid var(--accent);
        direction: rtl;
      }

      .output-panel__label {
        margin: 0;
        padding: 0;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        flex: 1;
        min-width: 8rem;
      }

      .output-panel--urdu .output-panel__label {
        text-align: right;
      }

      .output-panel__actions {
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
        align-items: center;
      }

      .output-panel--urdu .output-panel__actions {
        direction: rtl;
      }

      .panel-btn,
      .panel-link {
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.4rem 0.85rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface-hover);
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
        line-height: 1.2;
        transition:
          background 0.15s,
          border-color 0.15s;
      }

      .panel-btn:hover,
      .panel-link:hover {
        border-color: var(--accent);
        background: rgba(91, 159, 212, 0.12);
      }

      .panel-btn:focus-visible,
      .panel-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .output-panel__box {
        flex: 1;
        margin: 0;
        padding: 1rem 1.1rem;
        font-size: 1rem;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        overflow-y: auto;
        max-height: min(55vh, 480px);
        min-height: 200px;
      }

      .output-panel--english .output-panel__box {
        font-family: "Times New Roman", Times, serif;
        direction: ltr;
        text-align: left;
      }

      .output-panel--urdu .output-panel__box {
        font-family: "Jameel Noori Nastaleeq", "Noto Nastaliq Urdu", serif;
        direction: rtl;
        text-align: right;
        font-size: 1.15rem;
        line-height: 1.85;
      }

      .output-panel__box:empty::before {
        content: "No text in this category.";
        color: var(--text-muted);
        font-style: italic;
        font-family: "DM Sans", system-ui, sans-serif;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>PDF text extractor</h1>
        <p class="subtitle">
          Upload a PDF to extract text. Content is split into Latin (English) and
          Arabic block script (Urdu) using Unicode ranges.
        </p>
      </header>

      <section class="upload-section" aria-label="PDF upload">
        <input
          type="file"
          id="file-input"
          class="file-input"
          accept="application/pdf,.pdf"
          hidden
        />
        <button type="button" class="drop-zone" id="drop-zone" aria-describedby="drop-hint">
          <span class="drop-zone__icon" aria-hidden="true">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="12" y1="18" x2="12" y2="12" />
              <line x1="9" y1="15" x2="15" y2="15" />
            </svg>
          </span>
          <span class="drop-zone__title">Drop a PDF here or click to browse</span>
          <span class="drop-zone__hint" id="drop-hint">Only PDF files are accepted</span>
        </button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="outputs" id="outputs" hidden aria-label="Extracted text">
        <div class="output-panel output-panel--english">
          <div class="output-panel__head">
            <h2 class="output-panel__label">English (Latin)</h2>
            <div class="output-panel__actions">
              <button type="button" class="panel-btn" id="english-copy">Copy</button>
              <a class="panel-link" id="english-download" href="#" download="extracted-english.txt">Download</a>
            </div>
          </div>
          <div class="output-panel__box" id="english-output"></div>
        </div>
        <div class="output-panel output-panel--urdu">
          <div class="output-panel__head">
            <h2 class="output-panel__label">Urdu (Arabic block)</h2>
            <div class="output-panel__actions">
              <button type="button" class="panel-btn" id="urdu-copy">Copy</button>
              <a class="panel-link" id="urdu-download" href="#" download="extracted-urdu.txt">Download</a>
            </div>
          </div>
          <div class="output-panel__box" id="urdu-output" dir="rtl" lang="ur"></div>
        </div>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        const PDFJS_VERSION = "3.11.174";
        const WORKER_SRC = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;

        if (typeof pdfjsLib !== "undefined") {
          pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_SRC;
        }

        const ARABIC_BLOCK_START = 0x0600;
        const ARABIC_BLOCK_END = 0x06ff;

        const fileInput = document.getElementById("file-input");
        const dropZone = document.getElementById("drop-zone");
        const statusEl = document.getElementById("status");
        const outputsSection = document.getElementById("outputs");
        const englishOut = document.getElementById("english-output");
        const urduOut = document.getElementById("urdu-output");
        const englishCopyBtn = document.getElementById("english-copy");
        const urduCopyBtn = document.getElementById("urdu-copy");
        const englishDownloadLink = document.getElementById("english-download");
        const urduDownloadLink = document.getElementById("urdu-download");

        let englishBlobUrl = null;
        let urduBlobUrl = null;

        function revokeOutputBlobUrls() {
          if (englishBlobUrl) {
            URL.revokeObjectURL(englishBlobUrl);
            englishBlobUrl = null;
          }
          if (urduBlobUrl) {
            URL.revokeObjectURL(urduBlobUrl);
            urduBlobUrl = null;
          }
        }

        function setStatus(message, type) {
          statusEl.textContent = message || "";
          statusEl.classList.remove("status--error", "status--ok");
          if (type === "error") statusEl.classList.add("status--error");
          if (type === "ok") statusEl.classList.add("status--ok");
        }

        function isInArabicUrduBlock(char) {
          const cp = char.codePointAt(0);
          return cp >= ARABIC_BLOCK_START && cp <= ARABIC_BLOCK_END;
        }

        function isLatinScriptChar(char) {
          return /\p{Script=Latin}/u.test(char);
        }

        function splitEnglishUrdu(text) {
          let english = "";
          let urdu = "";
          let last = "english";
          for (const char of text) {
            if (isInArabicUrduBlock(char)) {
              urdu += char;
              last = "urdu";
              continue;
            }
            if (isLatinScriptChar(char)) {
              english += char;
              last = "english";
              continue;
            }
            if (last === "urdu") urdu += char;
            else english += char;
          }
          return { english, urdu };
        }

        async function extractTextFromPdf(arrayBuffer) {
          if (typeof pdfjsLib === "undefined") {
            throw new Error("PDF.js failed to load. Check your network connection.");
          }
          const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          const pdf = await loadingTask.promise;
          const parts = [];
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map((item) => ("str" in item ? item.str : "")).join(" ");
            parts.push(pageText);
          }
          return parts.join("\n\n");
        }

        async function copyToClipboard(text, doneLabel) {
          try {
            await navigator.clipboard.writeText(text);
            setStatus(`Copied ${doneLabel} to clipboard.`, "ok");
          } catch {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              setStatus(`Copied ${doneLabel} to clipboard.`, "ok");
            } catch {
              setStatus("Copy failed — select text manually or use Download.", "error");
            }
            document.body.removeChild(ta);
          }
        }

        function showOutputs(english, urdu, baseName) {
          revokeOutputBlobUrls();
          englishOut.textContent = english;
          urduOut.textContent = urdu;

          const safeBase =
            (baseName && baseName.replace(/[^\w\-]+/g, "_").replace(/_+/g, "_").slice(0, 80)) || "extracted";
          const enBlob = new Blob([english], { type: "text/plain;charset=utf-8" });
          const urBlob = new Blob([urdu], { type: "text/plain;charset=utf-8" });
          englishBlobUrl = URL.createObjectURL(enBlob);
          urduBlobUrl = URL.createObjectURL(urBlob);
          englishDownloadLink.href = englishBlobUrl;
          urduDownloadLink.href = urduBlobUrl;
          englishDownloadLink.download = `${safeBase}-english.txt`;
          urduDownloadLink.download = `${safeBase}-urdu.txt`;

          outputsSection.hidden = false;
        }

        async function handleFile(file) {
          if (!file || file.type !== "application/pdf") {
            setStatus("Please choose a PDF file.", "error");
            return;
          }
          setStatus("Processing PDF…", null);
          outputsSection.hidden = true;
          try {
            const buf = await file.arrayBuffer();
            const raw = await extractTextFromPdf(buf);
            const { english, urdu } = splitEnglishUrdu(raw);
            const base = file.name.replace(/\.pdf$/i, "") || "extracted";
            showOutputs(english, urdu, base);
            setStatus(`Done — extracted from "${file.name}".`, "ok");
          } catch (err) {
            console.error(err);
            setStatus(err.message || "Could not read this PDF.", "error");
          }
        }

        dropZone.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
          const file = fileInput.files && fileInput.files[0];
          if (file) handleFile(file);
          fileInput.value = "";
        });

        ["dragenter", "dragover", "dragleave", "drop"].forEach((ev) => {
          dropZone.addEventListener(ev, (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
        });

        dropZone.addEventListener("dragenter", () => dropZone.classList.add("dragover"));
        dropZone.addEventListener("dragover", () => dropZone.classList.add("dragover"));
        dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
        dropZone.addEventListener("drop", (e) => {
          dropZone.classList.remove("dragover");
          const file = e.dataTransfer.files && e.dataTransfer.files[0];
          if (file) handleFile(file);
        });

        englishCopyBtn.addEventListener("click", () => {
          copyToClipboard(englishOut.textContent, "English text");
        });
        urduCopyBtn.addEventListener("click", () => {
          copyToClipboard(urduOut.textContent, "Urdu text");
        });

        englishDownloadLink.addEventListener("click", (e) => {
          if (!englishBlobUrl) e.preventDefault();
        });
        urduDownloadLink.addEventListener("click", (e) => {
          if (!urduBlobUrl) e.preventDefault();
        });
      })();
    </script>
  </body>
</html>

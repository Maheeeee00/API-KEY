<!--
  Airport Passes Booking Form - close button placement update

  Apply this to the WordPress / Elementor popup HTML widget:
  1. Add the .ap-shell wrapper around .ap-container.
  2. Move the existing .ap-close-btn button outside .ap-container.
  3. Remove the old close button from inside .steps.
  4. Keep the existing apClosePopup() JavaScript unchanged.
-->

<!-- UPDATED WRAPPER / BUTTON POSITION -->
<div id="apMegaWrap">
  <div class="ap-shell">
    <button type="button" class="ap-close-btn" data-elementor-action="popup:close" aria-label="Close" onclick="apClosePopup()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <div class="ap-container">
      <div class="steps">
        <div class="step active">1 Service</div>
        <div class="step">2 Customer</div>
        <div class="step">3 Contact</div>
        <div class="step">4 Details</div>
      </div>

      <!-- Keep the existing <form id="apMegaForm">...</form> here unchanged. -->
    </div>
  </div>
</div>

<!-- ADD THIS NEW CSS NEAR YOUR OTHER #apMegaWrap LAYOUT CSS -->
<style>
#apMegaWrap .ap-shell{
  width:100%;
  max-width:960px;
  margin:0 auto;
  position:relative;
}

/*
  REPLACE the existing #apMegaWrap .ap-close-btn block with this.
  The button now sits outside the white .ap-container box.
*/
#apMegaWrap .ap-close-btn{
  position:absolute !important;
  top:-14px !important;
  right:-14px !important;
  width:28px !important;
  height:28px !important;
  background:#fff !important;
  border:1.5px solid var(--border) !important;
  border-radius:50% !important;
  cursor:pointer !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  z-index:9999 !important;
  padding:0 !important;
  min-height:0 !important;
  gap:0 !important;
  transition:background .2s, transform .2s !important;
  line-height:1 !important;
  color:#16325B !important;
  margin-left:0 !important;
  box-shadow:0 4px 14px rgba(0,0,0,.16) !important;
}

#apMegaWrap .ap-close-btn:hover{
  background:rgba(22,50,91,0.10) !important;
  transform:rotate(90deg) !important;
}

#apMegaWrap .ap-close-btn svg{
  width:13px !important;
  height:13px !important;
  pointer-events:none;
}

/*
  REPLACE only the close-button lines inside your existing @media(max-width:600px)
  and @media(max-width:380px) blocks with these responsive rules.
*/
@media(max-width:600px){
  #apMegaWrap .ap-shell{
    width:100% !important;
    max-width:100vw !important;
    position:relative !important;
  }

  #apMegaWrap .ap-close-btn{
    top:-10px !important;
    right:8px !important;
    width:24px !important;
    height:24px !important;
    min-height:0 !important;
    margin-left:0 !important;
  }

  #apMegaWrap .ap-close-btn svg{
    width:10px !important;
    height:10px !important;
  }
}

@media(max-width:380px){
  #apMegaWrap .ap-close-btn{
    top:-9px !important;
    right:6px !important;
    width:22px !important;
    height:22px !important;
  }

  #apMegaWrap .ap-close-btn svg{
    width:9px !important;
    height:9px !important;
  }
}
</style>
